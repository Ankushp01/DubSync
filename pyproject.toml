[project]
name = "dubsync"
version = "0.1.0"
description = "A local, staged video-dubbing pipeline"
requires-python = ">=3.11,<3.12"
dependencies = [
    "faster-whisper>=1.1.0,<2.0.0",
]

[project.scripts]
dubsync = "dubsync.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["dubsync*"]
